[package]
name = "jadedaily"
version = "2.0.0"
description = "简·画报 Jade Daily — New Chinese Style Zen Clock & Wallpaper"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde_json = "1"
chinese-lunisolar-calendar = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
