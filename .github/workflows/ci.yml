name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/jadedaily.exe dist/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: JadeDaily-windows
          path: dist/

  # 推送 v* 标签时自动把安装包与便携版附加到 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path src-tauri/target/release/jadedaily.exe `
            -DestinationPath "JadeDaily-${{ github.ref_name }}-windows-portable.zip"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            JadeDaily-*-windows-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
