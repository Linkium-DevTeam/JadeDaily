name: poster
description: "简·画报 Jade Daily — New Chinese Style Zen Clock & Wallpaper."
publish_to: 'none'

version: 1.3.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0                 # Bing 每日壁纸 / 一言 / 天气 API
  intl: ^0.20.2                # 中文日期格式化
  google_fonts: ^6.1.0         # 马善政毛笔 / 思源宋体
  window_manager: ^0.3.9       # 无边框窗口、全屏、拖拽
  shared_preferences: ^2.2.2   # 设置持久化
  path_provider: ^2.1.0        # 壁纸磁盘缓存 / 收藏目录
  lunar: ^1.2.0                # 农历 / 干支 / 生肖
  audioplayers: ^6.1.0         # 木鱼敲击声
  launch_at_startup: ^0.3.0    # 开机自启

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.12               # flutter pub run msix:create 打包商店安装包

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/sounds/

msix_config:
  display_name: 简·画报
  publisher_display_name: Axiom Pixel
  identity_name: AxiomPixel.79705F511985
  publisher: CN=63A88FD3-8AD9-4139-A6FA-51F75C7B6F0D
  msix_version: 1.3.0.0
  logo_path: assets/logo.png
  capabilities: internetClient,runFullTrust
  store: true
